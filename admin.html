<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aro'ma Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #18181b;
        }

        .box {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #007aff;
            color: white;
            width: 100%;
        }

        .danger {
            background: #ff3b30;
            color: white;
        }

        .logout {
            background: #666;
            color: white;
        }

        .error {
            color: #d00;
            margin-top: 10px;
        }

        .success {
            color: #16803a;
            margin-top: 10px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
        }

        .product-meta {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

    <div id="message"></div>

<div

    class="hidden"
    style="

        border-radius:14px;

>

        >

</label>

<details id="orderSection" open style="margin-bottom:15px;">

<script>

let adminToken = sessionStorage.getItem("aroma_admin_token");


async function login() {

    const password =
        document.getElementById("password").value.trim();

    const error =
        document.getElementById("loginError");

    error.innerText = "";

    if (!password) {
        error.innerText = "Parolni kiriting";
        return;
    }

    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    password: password
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            error.innerText = "Parol noto‘g‘ri!";
            return;
        }

        adminToken = result.token;

        sessionStorage.setItem(
            "aroma_admin_token",
            adminToken
        );

        showAdmin();

    } catch (error) {

        console.error(error);

        error.innerText =
            "Server bilan bog‘lanishda xatolik!";
    }
}


function showAdmin() {

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("adminPanel")
        .classList.remove("hidden");

loadProducts();
loadOrders();
loadCategories();
}


function logout() {

    sessionStorage.removeItem(
        "aroma_admin_token"
    );

    adminToken = null;

    document
        .getElementById("adminPanel")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");
}


async function loadProducts() {

    const list =
        document.getElementById("productList");

    try {

        const response = await fetch(
            "/api/admin/products",
            {
                headers: {
                    "Authorization":
                        "Bearer " + adminToken
                }
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        const products =
            await response.json();

        list.innerHTML = "";

        if (!products.length) {

            list.innerHTML =
                "<p>Mahsulotlar yo‘q.</p>";

            return;
        }

        products.forEach(product => {

            const item =
                document.createElement("div");

            item.className = "product";

            item.innerHTML = `
                <div class="product-info">
                    <div class="product-name">
                        ${product.name}
                    </div>

                    <div class="product-meta">
                        ${product.category} —
                        ${product.discountActive && product.discountPercent > 0
                            ? `<span style="text-decoration:line-through;color:#999;">${Number(product.price).toLocaleString()} so'm</span>
                               <span style="color:#e53935;font-weight:700;">${Math.round(Number(product.price) * (1 - Number(product.discountPercent) / 100)).toLocaleString()} so'm</span>
                               <span style="color:#e53935;">-${Number(product.discountPercent)}%</span>`
                            : `${Number(product.price).toLocaleString()} so'm`}
<br>
📦 Stock: ${Number(product.stock) || 0} ta
                    </div>
                </div>

<div style="display:flex; gap:6px;">
    <button
        style="background:#007aff; color:white;"
        onclick="editProduct(${product.id})"
    >
        ✏️ Tahrirlash
    </button>

    <button
        class="danger"
        onclick="deleteProduct(${product.id})"
    >
        🗑 O‘chirish
    </button>
</div>
            `;

            list.appendChild(item);
        });

    } catch (error) {

        console.error(error);

        list.innerHTML =
            "<p class='error'>Mahsulotlarni yuklashda xatolik.</p>";
    }
}


async function addProduct() {

    const message =
        document.getElementById("message");

    message.className = "";
    message.innerText = "";

    const name =
        document.getElementById("name").value.trim();

    const category =
        document.getElementById("category").value;

    const desc =
        document.getElementById("desc").value.trim();

    const price =
        Number(document.getElementById("price").value);

const stock =
    Number(document.getElementById("stock").value);

    const img =
        document.getElementById("img").value.trim();

const variantsText =
    document.getElementById("variants").value.trim();

const variants = variantsText
    ? variantsText
        .split("\n")
        .map(v => v.trim())
        .filter(Boolean)
    : [];

const discountPercent =
    Number(document.getElementById("discountPercent").value) || 0;

const discountActive =
    document.getElementById("discountActive").checked;

    if (!name) {
        message.className = "error";
        message.innerText = "Mahsulot nomini kiriting!";
        return;
    }

    if (!price || price <= 0) {
        message.className = "error";
        message.innerText = "Narxni to‘g‘ri kiriting!";
        return;
    }

    try {

        const response = await fetch(
            "/api/admin/products",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + adminToken
                },

                body: JSON.stringify({
                    name,
                    category,
                    desc,
                    price,
                    stock,
                    img,
                    variants,
                    discountPercent,
                    discountActive
                })
            }
        );

        const result =
            await response.json();

        if (response.status === 401) {
            logout();
            return;
        }

        if (!response.ok || !result.success) {

            message.className = "error";

            message.innerText =
                result.message ||
                "Mahsulotni saqlab bo‘lmadi.";

            return;
        }

        message.className = "success";

        message.innerText =
            "✅ Mahsulot muvaffaqiyatli qo‘shildi!";

        document.getElementById("name").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("price").value = "";
        document.getElementById("img").value = "";
document.getElementById("stock").value = "";
        loadProducts();

    } catch (error) {

        console.error(error);

        message.className = "error";

        message.innerText =
            "Server bilan bog‘lanishda xatolik.";
    }
}


async function deleteProduct(id) {

    if (!confirm("Bu mahsulotni o‘chirmoqchimisiz?")) {
        return;
    }

    try {

        const response = await fetch(
            "/api/admin/products/" + id,
            {
                method: "DELETE",

                headers: {
                    "Authorization":
                        "Bearer " + adminToken
                }
            }
        );

        if (response.status === 401) {
            logout();
            return;
        }

        const result =
            await response.json();

        if (result.success) {
            loadProducts();
        }

    } catch (error) {

        console.error(error);

        alert("Mahsulotni o‘chirishda xatolik.");
    }
}


if (adminToken) {
    showAdmin();
}

async function editProduct(id) {
    try {
        const response = await fetch(
            "/api/admin/products",
            {
                headers: {
                    "Authorization":
                        "Bearer " + adminToken
                }
            }
        );

        const products = await response.json();

        const product = products.find(
            p => Number(p.id) === Number(id)
        );

        if (!product) {
            alert("Mahsulot topilmadi!");
            return;
        }

        document.getElementById("editId").value =
            product.id;

        document.getElementById("editName").value =
            product.name;

        document.getElementById("editCategory").value =
            product.category;

        document.getElementById("editDesc").value =
            product.desc || "";

        document.getElementById("editPrice").value =
            product.price;
document.getElementById("editStock").value =
    Number(product.stock) || 0;

document.getElementById("editDiscountPercent").value =
    Number(product.discount_percent || product.discountPercent) || 0;

document.getElementById("editDiscountActive").checked =
    product.discount_active === true || product.discountActive === true;

        document.getElementById("editImg").value =
            product.img || "";

        document
            .getElementById("editMessage")
            .innerText = "";

        document
            .getElementById("editBox")
            .classList.remove("hidden");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {
        console.error(error);
        alert("Mahsulotni olishda xatolik.");
    }
}


function closeEdit() {
    document
        .getElementById("editBox")
        .classList.add("hidden");
}


async function saveEdit() {
    const id =
        document.getElementById("editId").value;

    const name =
        document.getElementById("editName").value.trim();

    const category =
        document.getElementById("editCategory").value;

    const desc =
        document.getElementById("editDesc").value.trim();

    const price =
        Number(
            document.getElementById("editPrice").value
        );

const stock =
    Number(
        document.getElementById("editStock").value
    );

const discountPercent =
    Number(document.getElementById("editDiscountPercent").value) || 0;

const discountActive =
    document.getElementById("editDiscountActive").checked;

    const img =
        document.getElementById("editImg").value.trim();

    const message =
        document.getElementById("editMessage");

    if (!name) {
        message.className = "error";
        message.innerText =
            "Mahsulot nomini kiriting!";
        return;
    }

    if (!price || price <= 0) {
        message.className = "error";
        message.innerText =
            "Narxni to‘g‘ri kiriting!";
        return;
    }

    try {
        const response = await fetch(
            "/api/admin/products/" + id,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + adminToken
                },
body: JSON.stringify({
    name,
    category,
    desc,
    price,
    stock,
    img,
    discountPercent,
    discountActive
})
            }
        );

        const result =
            await response.json();

        if (!response.ok || !result.success) {
            message.className = "error";
            message.innerText =
                result.message ||
                "Mahsulotni yangilab bo‘lmadi.";
            return;
        }

        message.className = "success";
        message.innerText =
            "✅ Mahsulot yangilandi!";

        loadProducts();

        setTimeout(() => {
            closeEdit();
        }, 800);

    } catch (error) {
        console.error(error);

        message.className = "error";
        message.innerText =
            "Server bilan bog‘lanishda xatolik.";
    }
}

async function uploadImage() {
    const fileInput = document.getElementById("imageFile");
    const message = document.getElementById("imageMessage");

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        message.className = "error";
        message.innerText = "Rasm 5 MB dan kichik bo‘lishi kerak.";
        return;
    }

    const reader = new FileReader();

    reader.onload = async function () {
        try {
            message.className = "";
            message.innerText = "⏳ Rasm yuklanmoqda...";

            const response = await fetch(
                "/api/admin/upload-image",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + adminToken
                    },
                    body: JSON.stringify({
                        image: reader.result
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {
                message.className = "error";
                message.innerText =
                    result.message || "Rasm yuklanmadi.";
                return;
            }

            document.getElementById("img").value = result.path;

            message.className = "success";
            message.innerText = "✅ Rasm yuklandi.";

        } catch (error) {
            console.error(error);

            message.className = "error";
            message.innerText =

async function uploadInlineDescriptionImage() {
    const fileInput = document.getElementById("inlineDescriptionImage");
    const textarea = document.getElementById("editDesc");
    const message = document.getElementById("inlineDescriptionMessage");

    const file = fileInput?.files?.[0];

    if (!file) {
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        message.className = "error";
        message.innerText = "Rasm 5 MB dan kichik bo‘lishi kerak.";
        fileInput.value = "";
        return;
    }

    try {
        message.className = "";
        message.innerText = "⏳ Rasm yuklanmoqda...";

        const reader = new FileReader();

        const imageData = await new Promise((resolve, reject) => {
            reader.onload = () => resolve(reader.result);
            reader.onerror = () =>
                reject(new Error("Rasmni o‘qib bo‘lmadi"));
            reader.readAsDataURL(file);
        });

        const response = await fetch(
            "/api/admin/upload-image",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + adminToken
                },
                body: JSON.stringify({
                    image: imageData
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Rasm yuklanmadi."
            );
        }

        const imageUrl = result.path || result.url || "";

        if (!imageUrl) {
            throw new Error("Rasm manzili qaytmadi.");
        }

        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? start;

        const before = textarea.value.substring(0, start);
        const after = textarea.value.substring(end);

        const imageMarker =
            `\n[IMAGE:${imageUrl}]\n`;

        textarea.value =
            before + imageMarker + after;

        const newCursorPosition =
            start + imageMarker.length;

        textarea.focus();
        textarea.setSelectionRange(
            newCursorPosition,
            newCursorPosition
        );

        message.className = "success";
        message.innerText =
            "✅ Rasm tavsifga qo‘shildi.";

        fileInput.value = "";

    } catch (error) {
        console.error(
            "INLINE DESCRIPTION IMAGE XATOSI:",
            error
        );

        message.className = "error";
        message.innerText =
            error.message || "Rasm yuklashda xatolik.";

        fileInput.value = "";
    }
}

async function editCategory(id, oldName) {
    const newName = prompt(
        'Yangi kategoriya nomini kiriting:',
        oldName
    );

    if (newName === null) return;

    const name = newName.trim();

    if (!name) {
        alert('Kategoriya nomi bo‘sh bo‘lishi mumkin emas');
        return;
    }

    const token = adminToken;

    try {
        // Kategoriyalarni olish
        const response = await fetch('/api/admin/categories', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const categories = await response.json();

        if (!response.ok || !Array.isArray(categories)) {
            alert('Kategoriyalarni olishda xatolik');
            return;
        }

        const currentCategory = categories.find(
            category => Number(category.id) === Number(id)
        );

        if (!currentCategory) {
            alert('Kategoriya topilmadi');
            return;
        }

        let parent_id = null;

        // Agar bu subkategoriya bo‘lsa, asosiy kategoriyani tanlash
        if (currentCategory.parent_id !== null) {

            const mainCategories = categories.filter(
                category =>
                    category.parent_id === null &&
                    Number(category.id) !== Number(id)
            );

            let parentText =
                '0. Asosiy kategoriya\n';

            mainCategories.forEach((category, index) => {
                parentText +=
                    `${index + 1}. ${category.name}\n`;
            });

            const currentParent = mainCategories.find(
                category =>
                    Number(category.id) === Number(currentCategory.parent_id)
            );

            if (currentParent) {
                parentText +=
                    `\nHozirgi asosiy kategoriya: ${currentParent.name}`;
            }

            const answer = prompt(
                'Asosiy kategoriyani tanlang:\n\n' +
                parentText +
                '\n\n0 - Asosiy kategoriya bo‘lishi uchun'
            );

            if (answer === null) return;

            const choice = Number(answer);

            if (!Number.isInteger(choice) || choice < 0 || choice > mainCategories.length) {
                alert('Noto‘g‘ri tanlov');
                return;
            }

            if (choice === 0) {
                parent_id = null;
            } else {
                parent_id = mainCategories[choice - 1].id;
            }

        } else {
            // Asosiy kategoriya bo‘lib qoladi
            parent_id = null;
        }

        const updateResponse = await fetch(
            `/api/admin/categories/${id}`,
            {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    name,
                    parent_id,
                    image: currentCategory.image || ''
                })
            }
        );

        const data = await updateResponse.json();

        if (!updateResponse.ok) {
            alert(
                data.error ||
                data.message ||
                'Kategoriya o‘zgartirishda xatolik'
            );
            return;
        }

        await loadCategories();

        alert('✅ Kategoriya o‘zgartirildi');

    } catch (error) {
        console.error('EDIT CATEGORY XATOSI:', error);
        alert('Server bilan bog‘lanishda xatolik');
    }
}

        input.value = '';

    try {
        const reader = new FileReader();

        reader.onload = async function () {
            try {
                const token = adminToken;

                const uploadResponse = await fetch('/api/admin/upload-image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        image: reader.result
                    })
                });

                const uploadData = await uploadResponse.json();

                if (!uploadResponse.ok || !uploadData.success) {
                    alert(
                        uploadData.message ||
                        uploadData.error ||
                        'Rasm yuklashda xatolik'
                    );
                    return;
                }

                const categoriesResponse = await fetch('/api/admin/categories', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const categories = await categoriesResponse.json();

                const category = Array.isArray(categories)
                    ? categories.find(c => Number(c.id) === Number(id))
                    : null;

                if (!category) {
                    alert('Kategoriya topilmadi');
                    return;
                }

                const updateResponse = await fetch(
                    `/api/admin/categories/${id}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            name: category.name,
                            parent_id: category.parent_id,
                            image: uploadData.imageUrl || uploadData.url || ''
                        })
                    }
                );

                const updateData = await updateResponse.json();

                if (!updateResponse.ok) {
                    alert(
                        updateData.message ||
                        updateData.error ||
                        'Kategoriya rasmini saqlashda xatolik'
                    );
                    return;
                }

                await loadCategories();

                alert('✅ Kategoriya rasmi o‘zgartirildi');

            } catch (error) {
                console.error('CATEGORY IMAGE XATOSI:', error);
                alert('Rasmni saqlashda xatolik');
            } finally {
                input.value = '';
            }
        };

        reader.readAsDataURL(file);

    } catch (error) {
        console.error('CATEGORY IMAGE READER XATOSI:', error);
        alert('Rasmni o‘qishda xatolik');
        input.value = '';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}


function escapeJs(text) {
    return String(text)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r/g, '')
        .replace(/\n/g, '\\n');
}

async function setCategoryDiscount(id, name) {
    const percentInput = prompt(name + " kategoriyasiga chegirma foizini kiriting:", "0");
    if (percentInput === null) return;

    const discountPercent = Math.min(100, Math.max(0, Number(percentInput) || 0));
    const active = confirm(discountPercent > 0 ? "Chegirmani yoqilsinmi?" : "Chegirmani o‘chirishni tasdiqlaysizmi?");

    try {
        const response = await fetch("/api/admin/categories/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + adminToken
            },
            body: JSON.stringify({
                name: name,
                discountPercent: discountPercent,
                discountActive: active
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            alert(result.message || "Chegirmani saqlab bo‘lmadi");
            return;
        }

        await loadCategories();
        alert("✅ " + name + " kategoriyasiga " + discountPercent + "% chegirma saqlandi");
    } catch (error) {
        console.error(error);
        alert("Server bilan bog‘lanishda xatolik");
    }
}

async function createCoupon() {
    const code = document.getElementById("couponCode").value.trim().toUpperCase();
    const discountPercent = Number(document.getElementById("couponDiscount").value) || 0;
    const minOrderAmount = Number(document.getElementById("couponMinAmount").value) || 0;
    const usageLimitValue = document.getElementById("couponUsageLimit").value;
    const usageLimit = usageLimitValue ? Number(usageLimitValue) : null;
    const startAt = document.getElementById("couponStartAt").value || null;
    const endAt = document.getElementById("couponEndAt").value || null;
    const active = document.getElementById("couponActive").checked;
    const message = document.getElementById("couponMessage");

    if (!code) {
        message.textContent = "❌ Kupon kodi kiriting";
        return;
    }

    if (discountPercent <= 0 || discountPercent > 100) {
        message.textContent = "❌ Chegirma 1% dan 100% gacha bo‘lishi kerak";
        return;
    }

    try {
        const response = await fetch("/api/admin/coupons", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + adminToken
            },
            body: JSON.stringify({
                code,
                discountPercent,
                minOrderAmount,
                usageLimit,
                startAt,
                endAt,
                active
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            message.textContent = "❌ " + (result.message || "Kupon yaratib bo‘lmadi");
            return;
        }

        message.textContent = "✅ " + code + " kuponi muvaffaqiyatli yaratildi";

        document.getElementById("couponCode").value = "";
        document.getElementById("couponDiscount").value = "";
        document.getElementById("couponMinAmount").value = "";
        document.getElementById("couponUsageLimit").value = "";
        document.getElementById("couponStartAt").value = "";
        document.getElementById("couponEndAt").value = "";
        document.getElementById("couponActive").checked = true;

    } catch (error) {
        console.error(error);
        message.textContent = "❌ Server bilan bog‘lanishda xatolik";
    }
}
