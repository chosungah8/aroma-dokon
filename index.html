<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Do'kon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f4f5; color: #18181b; padding: 12px; padding-bottom: 100px; }

        .header { text-align: center; margin-bottom: 12px; }
        .header h2 { font-size: 20px; }
        .header p { font-size: 12px; color: #71717a; }

        .search-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 12px; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #fff; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .desc { font-size: 11px; color: #71717a; margin-bottom: 6px; }
        .price { font-size: 12px; font-weight: bold; color: #007aff; margin-bottom: 8px; }

        .add-btn { background: #007aff; color: #fff; border: none; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; width: 100%; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e4e4e7; padding: 12px; display: none; justify-content: space-between; align-items: center; z-index: 50; }
        .cart-bar-btn { background: #34c759; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; border-radius: 16px 16px 0 0; padding: 16px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
        .close-btn { font-size: 20px; cursor: pointer; color: #888; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .qty-btn { width: 26px; height: 26px; border: 1px solid #ccc; background: #f4f4f5; border-radius: 4px; font-weight: bold; }

        .form-group { margin-top: 10px; }
        .form-group label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }

        .submit-btn { background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%; margin-top: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>✨ Aroma Do'kon</h2>
        <p>Eksklyuziv parfyumeriya to'plami</p>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="Atir nomini qidirish..." oninput="renderProducts()">

    <div class="grid" id="productGrid"></div>

    <div class="cart-bar" id="cartBar">
        <div>
            <div style="font-size: 11px; color: #71717a;">Jami summa:</div>
            <div id="cartBarTotal" style="font-weight: bold; font-size: 15px; color: #007aff;">0 so'm</div>
        </div>
        <button class="cart-bar-btn" onclick="openCartModal()">Savatcha va Buyurtma 🛒</button>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🛒 Buyurtmani rasmiylashtirish</span>
                <span class="close-btn" onclick="closeCartModal()">✕</span>
            </div>
            
            <div id="cartItemsList"></div>

            <div class="form-group">
                <label>Telefon raqamingiz:</label>
                <input type="tel" id="phoneInput" placeholder="+998 90 123 45 67">
            </div>

            <div class="form-group">
                <label>Yetkazib berish manzili:</label>
                <input type="text" id="addressInput" placeholder="Toshkent sh., Chilonzor tumani...">
            </div>

            <button class="submit-btn" onclick="sendOrder()">Buyurtmani tasdiqlash</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const products = [
            { id: 1, name: "Baccarat Rouge 540", desc: "Shirin va nafis sharqona ifor", price: 450000, img: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=300" },
            { id: 2, name: "Creed Aventus", desc: "Erkaklar uchun elit charmli atir", price: 600000, img: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=300" },
            { id: 3, name: "Dior Sauvage", desc: "Tazelik beruvchi sitrus aromati", price: 380000, img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=300" },
            { id: 4, name: "Tom Ford Lost Cherry", desc: "Gilos va oltxo'ri romantik ifori", price: 520000, img: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?w=300" }
        ];

        let cart = {}; 

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(p => p.name.toLowerCase().includes(search));

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <img src="${p.img}" alt="${p.name}">
                        <div class="title">${p.name}</div>
                        <div class="desc">${p.desc}</div>
                    </div>
                    <div>
                        <div class="price">${p.price.toLocaleString()} so'm</div>
                        <button class="add-btn" onclick="addToCart(${p.id})">Savatga qo'shish</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartBar();
        }

        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id] += delta;
                if (cart[id] <= 0) delete cart[id];
            }
            updateCartBar();
            renderCartItems();
        }

        function updateCartBar() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                const p = products.find(prod => prod.id == id);
                total += p.price * cart[id];
                count += cart[id];
            }

            const bar = document.getElementById('cartBar');
            if (count > 0) {
                bar.style.display = 'flex';
                document.getElementById('cartBarTotal').innerText = `${total.toLocaleString()} so'm (${count} ta)`;
            } else {
                bar.style.display = 'none';
                closeCartModal();
            }
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            let hasItems = false;
            for (let id in cart) {
                hasItems = true;
                const p = products.find(prod => prod.id == id);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div>
                        <b>${p.name}</b><br>
                        <span style="color:#71717a; font-size:11px;">${p.price.toLocaleString()} so'm</span>
                    </div>
                    <div>
                        <button class="qty-btn" onclick="changeQty(${id}, -1)">-</button>
                        <span style="margin: 0 8px; font-weight:bold;">${cart[id]}</span>
                        <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
                    </div>
                `;
                list.appendChild(itemDiv);
            }

            if (!hasItems) closeCartModal();
        }

        function sendOrder() {
            const phone = document.getElementById('phoneInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();

            if (!phone || !address) {
                alert('Iltimos, telefon raqamingiz va manzilingizni kiriting!');
                return;
            }

            const orderItems = [];
            let total = 0;
            for (let id in cart) {
                const p = products.find(prod => prod.id == id);
                orderItems.push({ name: p.name, count: cart[id], price: p.price });
                total += p.price * cart[id];
            }

            const orderData = {
                items: orderItems,
                total: total,
                phone: phone,
                address: address
            };

            tg.sendData(JSON.stringify(orderData));
        }

        renderProducts();
    </script>
</body>
</html>
